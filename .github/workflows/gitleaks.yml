name: gitleaks
on: [push, pull_request, workflow_dispatch]
jobs:
  gitleaks-run:
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: '0'

      - name: Run Gitleaks
        id: gitleaks
        run: |
          git config --global --add safe.directory $PWD
          gitleaks detect -f sarif -r ./gitleaks-report-semantic-hub.sarif --exit-code 0

      - name: Upload artifact
        uses: actions/upload-artifact@4cedc5d8fe5721698f1c834b060731f2090d2309 # v4.6.1
        with:
          name: gitleaks-report
          path: ./gitleaks-report-semantic-hub.sarif
        

  gitleaks-upload:
    runs-on: ubuntu-latest
    needs: gitleaks-run
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: gitleaks-report
      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        with:
          sarif_file: ./gitleaks-report-semantic-hub.sarif
