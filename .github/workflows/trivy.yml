name: Trivy

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  analyze-config:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@18f2510ee396b97da5400bd47b39f4f465da5fdb # v0.29.0
        with:
          scan-type: "config"
          format: "sarif"
          output: "trivy-results1.sarif"
          severity: "CRITICAL,HIGH" 
          hide-progress: false
          vuln-type: "os,library"
          exit-code: "1" 
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        if: always()
        with:
          sarif_file: "trivy-results1.sarif"

  analyze-semantic-hub:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        
      - uses: actions/setup-java@3a4f6111f18e3a0147563e7784f39100145c11a0 # v4.5.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build JAR
        run: mvn clean package -DskipTests
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@18f2510ee396b97da5400bd47b39f4f465da5fdb # v0.29.0
        with:
          image-ref: "tractusx/sldt-semantic-hub:latest"
          format: "sarif"
          output: "trivy-results-semantic-hub.sarif"
          severity: "CRITICAL,HIGH" 
          hide-progress: false
          exit-code: "1" 
          vuln-type: "os,library"
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        if: always()
        with:
          sarif_file: "trivy-results-semantic-hub.sarif"
